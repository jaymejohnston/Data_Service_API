[pytest]
# tests/ has no __init__.py, so without this pytest only adds the tests/
# directory itself to sys.path - not the repo root, where api_url_utils.py,
# data_explorer_client.py, organizations_client.py, and ticket_api_client.py
# actually live. This makes `pytest tests/` work from the repo root without
# needing PYTHONPATH set manually.
pythonpath = .
